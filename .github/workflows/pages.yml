name: Deploy site

# Publishes the site to GitHub Pages on every push to main. Before upload it
# stamps the commit into index.html's asset URLs (css/style.css?v=dev becomes
# ?v=<sha>), so a browser or Cloudflare cache never mixes css/js files from two
# deploys. Locally the files keep ?v=dev and load as they are.
# Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp asset versions
        run: |
          sed -i "s/?v=dev\"/?v=${GITHUB_SHA::7}\"/g" index.html
          if grep -q '?v=dev"' index.html; then echo "unstamped asset left" >&2; exit 1; fi
          grep -o '?v=[0-9a-f]*"' index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
