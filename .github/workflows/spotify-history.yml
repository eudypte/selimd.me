name: Spotify listening history

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch recently played and write data file
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          access_token=$(curl -sf -X POST https://accounts.spotify.com/api/token \
            -u "${SPOTIFY_CLIENT_ID}:${SPOTIFY_CLIENT_SECRET}" \
            -d grant_type=refresh_token \
            -d refresh_token="${SPOTIFY_REFRESH_TOKEN}" \
            | jq -r '.access_token')

          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Failed to obtain Spotify access token" >&2
            exit 1
          fi

          curl -sf -X GET "https://api.spotify.com/v1/me/player/recently-played?limit=50" \
            -H "Authorization: Bearer ${access_token}" \
            -o /tmp/spotify-raw.json

          mkdir -p data
          jq '[.items[] | {
                name: .track.name,
                artists: [.track.artists[].name],
                album: .track.album.name,
                playedAt: .played_at,
                url: .track.external_urls.spotify
              }]' /tmp/spotify-raw.json > data/spotify-recent.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/spotify-recent.json)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "spotify-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/spotify-recent.json
          git commit -m "chore: refresh spotify listening history"
          git push
