<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>selimd.me</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="crt">
    <main>
      <div class="commander">
        <div class="pane" id="pane-left">
          <div class="pane-title" id="left-title">C:\</div>
          <ul class="file-list" id="file-list"></ul>
        </div>
        <div class="pane" id="pane-right">
          <div class="pane-title" id="right-title">Info</div>
          <pre class="viewer-content" id="viewer-content"></pre>
        </div>
      </div>
      <div class="status-bar" id="status-bar">C:\</div>
      <div class="fkeys">
        <span><b>1</b>Help</span>
        <span><b>2</b>Menu</span>
        <span><b>3</b>View</span>
        <span><b>4</b>Edit</span>
        <span><b>5</b>Copy</span>
        <span><b>6</b>Move</span>
        <span><b>7</b>Mkdir</span>
        <span><b>8</b>Delete</span>
        <span><b>9</b>Menu</span>
        <span><b>0</b>Quit</span>
      </div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
